name: AllergyLab CI/CD

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        working-directory: Part7a
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/allergylab:latest ./app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-db-loader:latest ./db-loader
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-email:latest ./email
      - name: Log in to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push images to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/allergylab:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/al-db-loader:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/al-email:latest
